name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build React / Vite App
      - name: Build Application
        run: npm run build

      # Step 5: Sync files to cPanel Hosting via FTP
      - name: Deploy to cPanel FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 'ftp.runconnect.name.ng'
          username: 'xveexfwe'
          password: '-BX8P09dqv9tG)'
          port: 1624
          # Local directory to upload (dist contains the compiled static files)
          local-dir: ./dist/
          # Remote directory on cPanel (usually public_html or a subdomain folder)
          server-dir: ./runflix/
          # Delete any files on the server that do not exist locally anymore
          dangerous-clean-slate: false
